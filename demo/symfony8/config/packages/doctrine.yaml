parameters:
    env(DATABASE_URL): 'mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_mapping: true
        mappings:
            App:
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                is_bundle: false
