# UiKit page contract (REQ-UI-003): one host layout and one theme for every Nowo bundle page. The demo host layout
# (templates/layouts/admin.html.twig) adds a small masthead and Bootstrap Icons; css_framework none = UiKit's own
# nowo-ui.css styles every page (no CSS framework).
nowo_ui_kit:
    css_framework: none
    icon_set: bootstrap-icons
    layouts:
        admin: 'layouts/admin.html.twig'
