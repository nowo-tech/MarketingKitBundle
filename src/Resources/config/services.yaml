services:
    _defaults:
        autowire: true
        autoconfigure: true

    Nowo\MarketingKitBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Controller/'
            - '../../NowoMarketingKitBundle.php'
            - '../../Resources/'

    # Controllers are not autoconfigured (REQ-SF-004 rule 7): on Symfony >= 7.3 a #[Route] class is autoconfigured with
    # the routing.controller tag, and the host's default `routing.controllers` resource would then expose the admin
    # without the host importing routing.yaml. Routes are opt-in only; the AbstractController tags are explicit.
    Nowo\MarketingKitBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\MarketingKitBundle\Config\MarketingConfigResolver:
        arguments:
            $profiles: '%nowo_marketing_kit.profiles%'
            $defaultProfile: '%nowo_marketing_kit.default_profile%'
            $useDatabaseConfig: '%nowo_marketing_kit.use_database_config%'

    Nowo\MarketingKitBundle\Service\MarketingToolAdminService:
        arguments:
            $profiles: '%nowo_marketing_kit.profiles%'
            $defaultProfile: '%nowo_marketing_kit.default_profile%'

    Nowo\MarketingKitBundle\Controller\MarketingToolAdminController:
        autoconfigure: false
        arguments:
            $useDatabaseConfig: '%nowo_marketing_kit.use_database_config%'
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # REQ-UI-003 page plumbing: layout, per-page templates, form themes and view models of the admin pages.
    Nowo\MarketingKitBundle\Ui\MarketingKitPages:
        arguments:
            $enabled: '%nowo_marketing_kit.web_ui.enabled%'
            $layoutTemplate: '%nowo_marketing_kit.web_ui.layout_template%'
            $templates: '%nowo_marketing_kit.web_ui.templates%'
            $formThemes: '%nowo_marketing_kit.web_ui.form_themes%'
            $twig: '@?twig'

    Nowo\MarketingKitBundle\Consent\CookieConsentGate:
        arguments:
            $respectCookieConsent: '%nowo_marketing_kit.respect_cookie_consent%'

    Nowo\MarketingKitBundle\Consent\ConsentGateInterface: '@Nowo\MarketingKitBundle\Consent\CookieConsentGate'

    Nowo\MarketingKitBundle\Provider\ToolRendererRegistry:
        arguments:
            $renderers: !tagged_iterator nowo_marketing_kit.tool_renderer

    Nowo\MarketingKitBundle\Provider\GtmRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\Ga4Renderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\MetaPixelRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\LinkedInRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\TikTokRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\HotjarRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\ClarityRenderer:
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Provider\CustomScriptRenderer:
        arguments:
            $allowCustomHtml: '%nowo_marketing_kit.security.allow_custom_html%'
        tags: ['nowo_marketing_kit.tool_renderer']

    Nowo\MarketingKitBundle\Service\MarketingScriptRenderer:
        arguments:
            $requestStack: '@request_stack'
            $allowRequiredTrackers: '%nowo_marketing_kit.security.allow_required_trackers%'
            $cspNonceAttribute: '%nowo_marketing_kit.security.csp_nonce_attribute%'

    Nowo\MarketingKitBundle\Twig\MarketingKitExtension:
        arguments:
            $layoutTemplate: '%nowo_marketing_kit.web_ui.layout_template%'
            $cssFramework: '%nowo_marketing_kit.web_ui.css_framework%'
        tags: ['twig.extension']

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\MarketingKitBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    Nowo\MarketingKitBundle\Form\MarketingToolType:
        arguments:
            $allowCustomHtml: '%nowo_marketing_kit.security.allow_custom_html%'
            $allowRequiredTrackers: '%nowo_marketing_kit.security.allow_required_trackers%'
        tags: ['form.type']
