# CodeRabbit configuration for nowo-tech/MarketingKitBundle.
# Requires the CodeRabbit GitHub App installed on nowo-tech/MarketingKitBundle.

language: en-US
reviews:
    profile: chill
    request_changes_workflow: false
    high_level_summary: true
    poem: false
    review_status: true
    collapse_walkthrough: true
chat:
    auto_reply: true
knowledge_base:
    opt_out: false
path_filters:
    - "!demo/**/vendor/**"
    - "!**/coverage/**"
    - "!**/*.lock"
early_access: false
tone_instructions: |
    Prefer concise, actionable feedback for nowo-tech/marketing-kit-bundle
    (Symfony marketing tools: GTM/GA4/pixels, YAML+Doctrine config, CookieConsent-compatible gating).
